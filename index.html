<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Athens transit — interactive</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./data.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Helvetica Neue", Arial, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      background: rgba(255,255,255,.94); border-radius: 10px; padding: 10px 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,.25); font-size: 13px; color: #222; user-select: none;
    }
    .panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
    .panel label { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }
    .hint { margin-top: 8px; font-size: 11px; color: #666; max-width: 190px; line-height: 1.35; }
    .maplibregl-popup-content { font-family: inherit; padding: 10px 12px; border-radius: 8px; }
    .pop-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .pop-lines { display: flex; flex-wrap: wrap; gap: 4px; max-width: 240px; }
    .chip { color: #fff; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Athens — public transport</h1>
    <div id="filters"></div>
    <div class="hint">Click a dot for its name and lines. Zoom in to see stop names.</div>
  </div>
  <script>
    const A = window.ATHENS;
    const MODE_ORDER = ["3", "800", "900", "1"]; // draw order: bus … metro on top
    const B = A.bbox;

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
        sources: {
          basemap: {
            type: "raster", tileSize: 256,
            tiles: ["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                    "https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"],
            attribution: "© OpenStreetMap © CARTO",
          },
        },
        layers: [
          { id: "bg", type: "background", paint: { "background-color": "#e9e6e0" } },
          { id: "basemap", type: "raster", source: "basemap" },
        ],
      },
      bounds: [[B.west, B.south], [B.east, B.north]],
      fitBoundsOptions: { padding: 20 },
      // keep the view inside the data area (+ small margin) so lines that leave
      // the mapped area read as the map edge, not as broken dead-ends over an
      // empty basemap.
      maxBounds: [[B.west - 0.01, B.south - 0.01], [B.east + 0.01, B.north + 0.01]],
      maxZoom: 19,
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

    function addData() {
      if (map.getSource("routes")) return; // already added
      // deduped one-per-street geometry for the coloured lines …
      map.addSource("lines", { type: "geojson", data: A.lines });
      // … full per-route parts, used only for placing route numbers.
      map.addSource("routes", { type: "geojson", data: A.routes });
      map.addSource("stops", { type: "geojson", data: A.stops });
      map.addSource("termini", { type: "geojson", data: A.termini });

      // Each mode gets its own parallel lane (line-offset) so where several
      // modes share a street they sit SIDE BY SIDE, not stacked, and all stay
      // visible. Casing (white halo) uses the same offset, drawn under all.
      const laneOf = { "3": -1.5, "800": -0.5, "900": 0.5, "1": 1.5 };
      const laneOffset = (mode) => ["interpolate", ["linear"], ["zoom"],
        11, laneOf[mode] * 1.1, 16, laneOf[mode] * 3.6];
      for (const mode of MODE_ORDER) {
        map.addLayer({
          id: "casing-" + mode, type: "line", source: "lines",
          filter: ["==", ["get", "mode"], mode],
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": "#ffffff", "line-opacity": 0.85,
            "line-offset": laneOffset(mode),
            "line-width": ["interpolate", ["linear"], ["zoom"], 11, 3, 16, 8],
          },
        });
      }
      for (const mode of MODE_ORDER) {
        map.addLayer({
          id: "routes-" + mode, type: "line", source: "lines",
          filter: ["==", ["get", "mode"], mode],
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": A.colors[mode],
            "line-offset": laneOffset(mode),
            "line-width": ["interpolate", ["linear"], ["zoom"], 11, 1.4, 16, 5],
          },
        });
      }

      // route numbers written ALONG each line (mode-colored), repeated down the
      // street; MapLibre's collision thins them out and more appear as you zoom.
      for (const mode of MODE_ORDER) {
        map.addLayer({
          id: "nums-" + mode, type: "symbol", source: "routes", minzoom: 13,
          filter: ["==", ["get", "mode"], mode],
          layout: {
            "symbol-placement": "line",
            "text-field": ["get", "rsn"],
            "text-font": ["Open Sans Bold"],
            // ~2x bigger and lifted off the line (per Alex's feedback).
            "text-size": ["interpolate", ["linear"], ["zoom"], 13, 18, 17, 26],
            "text-offset": [0, -1.4],
            "symbol-spacing": 260,
            "text-allow-overlap": false,
            "text-padding": 4,
          },
          paint: {
            "text-color": A.colors[mode],
            "text-halo-color": "#ffffff",
            "text-halo-width": 2.2,
          },
        });
      }

      const modeMatch = ["match", ["get", "topMode"]];
      for (const m of MODE_ORDER) modeMatch.push(m, A.colors[m]);
      modeMatch.push("#555");

      // all stops: white inside, black outline
      map.addLayer({
        id: "stops", type: "circle", source: "stops",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 2.2, 16, 5],
          "circle-color": "#ffffff",
          "circle-stroke-color": "#111111",
          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 11, 1, 16, 2],
        },
      });
      // terminus / loop markers — a bigger, thicker white/black ring at every
      // line-end inside the map (distinct from ordinary stops by size).
      map.addLayer({
        id: "termini", type: "circle", source: "termini",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 3.4, 16, 7.5],
          "circle-color": "#ffffff",
          "circle-stroke-color": "#111111",
          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 11, 2, 16, 3.6],
        },
      });

      map.addLayer({
        id: "stop-labels", type: "symbol", source: "stops", minzoom: 13.5,
        layout: {
          "text-field": ["get", "name"],
          "text-size": ["interpolate", ["linear"], ["zoom"], 13.5, 10, 17, 13],
          "text-font": ["Open Sans Regular"],
          "text-variable-anchor": ["left", "right", "top", "bottom"],
          "text-radial-offset": 0.7,
          "text-justify": "auto",
          "text-optional": true,          // hide label (keep dot) when it collides
          "text-padding": 3,
        },
        paint: { "text-color": "#1a1a1a", "text-halo-color": "#fff", "text-halo-width": 1.4 },
      });

      // ---- click a stop -> popup with name + lines ----
      map.on("click", "stops", (e) => {
        const p = e.features[0].properties;
        const lines = typeof p.lines === "string" ? JSON.parse(p.lines) : p.lines;
        const chips = lines.map((l) =>
          `<span class="chip" style="background:${A.colors[l.mode]}">${l.rsn}</span>`).join("");
        new maplibregl.Popup({ offset: 8, maxWidth: "280px" })
          .setLngLat(e.lngLat)
          .setHTML(`<div class="pop-name">${p.name}</div><div class="pop-lines">${chips}</div>`)
          .addTo(map);
      });
      map.on("mouseenter", "stops", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "stops", () => (map.getCanvas().style.cursor = ""));

      // ---- click a terminus -> popup: lines that end / turn here ----
      map.on("click", "termini", (e) => {
        const p = e.features[0].properties;
        const lines = typeof p.lines === "string" ? JSON.parse(p.lines) : p.lines;
        const chips = lines.map((l) =>
          `<span class="chip" style="background:${A.colors[l.mode]}">${l.rsn}</span>`).join("");
        new maplibregl.Popup({ offset: 8, maxWidth: "280px" })
          .setLngLat(e.lngLat)
          .setHTML(`<div class="pop-name">Terminus / loop</div><div class="pop-lines">${chips}</div>`)
          .addTo(map);
      });
      map.on("mouseenter", "termini", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "termini", () => (map.getCanvas().style.cursor = ""));

      // ---- mode filter toggles: affect lines, numbers, stops, termini ----
      const names = { "1": "Metro", "900": "Tram", "800": "Trolleybus", "3": "Bus" };
      const active = new Set(["1", "900", "800", "3"]);
      function applyFilters() {
        const on = [...active];
        for (const m of ["1", "900", "800", "3"]) {
          const vis = active.has(m) ? "visible" : "none";
          map.setLayoutProperty("casing-" + m, "visibility", vis);
          map.setLayoutProperty("routes-" + m, "visibility", vis);
          map.setLayoutProperty("nums-" + m, "visibility", vis);
        }
        // stops / termini: show only if AT LEAST ONE active mode serves them.
        // ["any"] with no active modes evaluates to false -> everything hidden
        // (fixes dots staying after the last mode is switched off).
        const anyActive = ["any", ...on.map((m) => ["in", m, ["get", "modes"]])];
        map.setFilter("stops", anyActive);
        map.setFilter("stop-labels", anyActive);
        map.setFilter("termini", anyActive);
      }

      const box = document.getElementById("filters");
      for (const mode of ["1", "900", "800", "3"]) {
        const row = document.createElement("label");
        row.innerHTML =
          `<input type="checkbox" checked data-mode="${mode}">` +
          `<span class="swatch" style="background:${A.colors[mode]}"></span>${names[mode]}`;
        row.querySelector("input").addEventListener("change", (ev) => {
          if (ev.target.checked) active.add(mode); else active.delete(mode);
          applyFilters();
        });
        box.appendChild(row);
      }
      applyFilters();
    }

    // Add the transit data once the style is ready. We do NOT wait for the
    // "load" event (it also waits for basemap tiles, which can stall); poll for
    // the style instead so sources/layers are added reliably.
    (function tryAdd() {
      if (map.isStyleLoaded()) addData();
      else setTimeout(tryAdd, 80);
    })();
  </script>
</body>
</html>
